<script>
const wrap=document.getElementById('wrap'),cv=document.getElementById('c'),g=cv.getContext('2d',{alpha:false}),W=400;
function avail(){const v=window.visualViewport;const w=v&&v.width?v.width:document.documentElement.clientWidth||innerWidth;const h=v&&v.height?v.height:document.documentElement.clientHeight||innerHeight;return[Math.max(1,w),Math.max(1,h)]}

let best=0;try{best=+localStorage.getItem('gg_best')||0}catch(e){}
let state='ready',t=0,score=0,bat,pipes=[],shake=0,flash=0,bolt=0,boltPts=[];
let grapples=1,inv=0,grap=null,combo=0,perf=0,perfT='',punchT=0,punchCd=0,kos=0,foes=[],pops=[],orbs=[],shots=[],heli=null,gust=null,shield=false,slowT=0,pat='rand',pstep=0,lastTop=200,boss=null,bossOn=false,bossN=0,nextBoss=50;
const BASE_GAP=134,BASE_SPEED=2.35,GRAV=.26,JUMP=-5.3,MAXFALL=6.5;
let GAP=BASE_GAP,SPEED=BASE_SPEED,msg=0,pipeN=0,msgT='',tint=[0,0,0,0],bm=0;
const TG=[[0,0,0,0],[35,70,75,.24],[20,22,80,.3],[150,10,20,.34]];
const lamps=[0,1,2].map(i=>({x:60+i*220}));
const stars=[...Array(40)].map(()=>({x:Math.random()*W,y:Math.random()*260,r:Math.random()*1.2+.3}));

// ---------- pre-rendered sprites (drawn once, blitted every frame) ----------
function mkLayer(w,h,fn){const c=document.createElement('canvas');c.width=w*SC;c.height=h*SC;c.dw=w;c.dh=h;const x=c.getContext('2d');x.scale(SC,SC);fn(x);return c}
function D(i,x,y,w,h){g.drawImage(i,x,y,w||i.dw,h||i.dh)}
function batPath(c){const R=[[2.5,-3.5],[7,-5],[12,-2],[10,0],[8.5,-.5],[6.5,3],[4.5,1.5],[2,5.5]];
 c.beginPath();c.moveTo(0,-3);c.lineTo(1.5,-6.5);R.forEach(q=>c.lineTo(q[0],q[1]));c.lineTo(0,4);
 for(let i=R.length-1;i>=0;i--)c.lineTo(-R[i][0],R[i][1]);c.lineTo(-1.5,-6.5);c.closePath()}
const SKY=mkLayer(W,H,x=>{
 const sk=x.createLinearGradient(0,0,0,H);sk.addColorStop(0,'#03050b');sk.addColorStop(.45,'#0b1220');sk.addColorStop(.8,'#1a2236');sk.addColorStop(1,'#2b2a3a');x.fillStyle=sk;x.fillRect(0,0,W,H);
 const hg=x.createRadialGradient(W/2,H+20,10,W/2,H+20,400);hg.addColorStop(0,'rgba(200,125,70,.24)');hg.addColorStop(1,'rgba(200,125,70,0)');x.fillStyle=hg;x.fillRect(0,0,W,H);
 const mg=x.createRadialGradient(310,92,10,310,92,130);mg.addColorStop(0,'rgba(190,205,240,.38)');mg.addColorStop(1,'rgba(190,205,240,0)');x.fillStyle=mg;x.fillRect(150,0,250,250);
 const md=x.createRadialGradient(303,85,3,310,92,27);md.addColorStop(0,'#f6f3e2');md.addColorStop(1,'#bfc5b0');x.fillStyle=md;x.beginPath();x.arc(310,92,27,0,7);x.fill();
 x.fillStyle='rgba(110,115,100,.3)';[[300,84,6,5],[318,100,5,4],[312,80,3,3],[298,100,4,3.5]].forEach(c=>{x.beginPath();x.ellipse(c[0],c[1],c[2],c[3],0,0,7);x.fill()});
});
const CL=mkLayer(800,190,x=>{
 for(let i=0;i<22;i++){const bx=Math.random()*800,by=30+Math.random()*130,R=50+Math.random()*60;
  [-800,0,800].forEach(d=>{x.save();x.translate(bx+d,by);x.scale(1,.38);
   const gr=x.createRadialGradient(0,0,0,0,0,R);gr.addColorStop(0,'rgba(12,17,30,.5)');gr.addColorStop(1,'rgba(12,17,30,0)');x.fillStyle=gr;x.beginPath();x.arc(0,0,R,0,7);x.fill();
   const lg=x.createRadialGradient(0,-R*.35,0,0,-R*.35,R*.8);lg.addColorStop(0,'rgba(110,125,165,.10)');lg.addColorStop(1,'rgba(110,125,165,0)');x.fillStyle=lg;x.beginPath();x.arc(0,-R*.35,R*.8,0,7);x.fill();x.restore()})}
});
function bakeCity(c,a,col,winCol,density,chim){
 a.forEach(b=>{const top=H-b.h,cxm=b.x+b.w/2;
  c.fillStyle=col;c.fillRect(b.x,top,b.w,b.h);c.fillStyle='rgba(140,160,210,.10)';c.fillRect(b.x,top,b.w,1.5);c.fillStyle=col;
  if(b.win>.75){c.beginPath();c.moveTo(b.x+b.w*.25,top);c.lineTo(cxm,top-52);c.lineTo(b.x+b.w*.75,top);c.fill();c.fillRect(cxm-1,top-66,2,16);c.fillRect(b.x-2,top-8,5,8);c.fillRect(b.x+b.w-3,top-8,5,8)}
  else if(b.win>.5){c.beginPath();c.moveTo(b.x-3,top);c.lineTo(cxm,top-b.w*.6);c.lineTo(b.x+b.w+3,top);c.fill()}
  else if(b.win>.25){c.fillRect(b.x+b.w*.65,top-26,10,26);c.fillRect(b.x+b.w*.65-2,top-30,14,5);chim.push({x:b.x+b.w*.65+5,y:top-30,seed:b.win*500})}
  for(let y=top+10;y<H-20;y+=16)for(let x=b.x+6;x<b.x+b.w-8;x+=12){
   const ci=Math.round((x-b.x)/12),ri=Math.round((y-top)/16),hh=((ci*37+ri*91+((b.win*1000)|0))%100)/100;
   if(hh<density){c.fillStyle=density>.2?(hh<density*.25?'#8fb8dc':(hh<density*.6?winCol:'#f0d78a')):winCol;c.fillRect(x,y+2,4,5);c.fillRect(x+.5,y,3,2)}}
  if(b.win>.5&&b.win<=.53&&b.w>34){c.fillStyle='rgba(225,210,150,.75)';c.beginPath();c.arc(cxm,top+16,7,0,7);c.fill();
   c.strokeStyle='#1a1a22';c.lineWidth=1.2;c.beginPath();c.moveTo(cxm,top+16);c.lineTo(cxm,top+11);c.moveTo(cxm,top+16);c.lineTo(cxm+4,top+17);c.stroke()}
 })}
function mkCityLayer(minH,maxH,w,col,winCol,density){
 const SW=800,a=[],chim=[];let x=0;
 while(x<SW){let ww=w*(.6+Math.random()*.9);if(x+ww>SW-20)ww=SW-x;a.push({x,w:ww,h:minH+Math.random()*(maxH-minH),win:Math.random()});x+=ww}
 return{img:mkLayer(SW,H,c=>bakeCity(c,a,col,winCol,density,chim)),chim,off:0}}
const far=mkCityLayer(170,300,38,'#0c1020','#2a3350',.12),near=mkCityLayer(90,210,52,'#080b14','#c79a30',.22);
const PUFF=mkLayer(32,32,x=>{const gr=x.createRadialGradient(16,16,0,16,16,16);gr.addColorStop(0,'rgba(150,158,176,1)');gr.addColorStop(1,'rgba(150,158,176,0)');x.fillStyle=gr;x.fillRect(0,0,32,32)});
const GLOWB=mkLayer(84,84,x=>{const gr=x.createRadialGradient(42,42,2,42,42,42);gr.addColorStop(0,'rgba(120,150,230,.16)');gr.addColorStop(1,'rgba(120,150,230,0)');x.fillStyle=gr;x.fillRect(0,0,84,84)});
const LAMPG=mkLayer(140,140,x=>{const gr=x.createRadialGradient(70,70,2,70,70,70);gr.addColorStop(0,'rgba(255,215,140,.34)');gr.addColorStop(1,'rgba(255,215,140,0)');x.fillStyle=gr;x.fillRect(0,0,140,140)});
function sigBat(c,s){
 const S=[.07,-.12],G=[[[.3,-.34],[.52,-.44]],[[.82,-.56],[1,-.3]],[[.8,-.14],[.9,.02]],[[.72,.04],[.68,.2]],[[.52,.1],[.44,.26]],[[.3,.12],[.1,.2]]];
 c.beginPath();c.moveTo(S[0]*s,S[1]*s);
 G.forEach(g=>c.quadraticCurveTo(g[0][0]*s,g[0][1]*s,g[1][0]*s,g[1][1]*s));
 c.lineTo(.05*s,.34*s);c.lineTo(0,.4*s);c.lineTo(-.05*s,.34*s);
 for(let i=G.length-1;i>=0;i--){const e=i?G[i-1][1]:S;c.quadraticCurveTo(-G[i][0][0]*s,G[i][0][1]*s,-e[0]*s,e[1]*s)}
 c.closePath();c.fill();
 c.beginPath();c.ellipse(0,.05*s,.1*s,.25*s,0,0,7);c.fill();
 c.beginPath();c.ellipse(0,-.23*s,.1*s,.11*s,0,0,7);c.fill();
 [-1,1].forEach(k=>{c.beginPath();c.moveTo(k*.09*s,-.26*s);c.lineTo(k*.12*s,-.5*s);c.lineTo(k*.02*s,-.31*s);c.closePath();c.fill()})}
const SIG=mkLayer(W,H,x=>{
 const sx=70,sy=H-120,cx=135,cy=122;
 let bg=x.createLinearGradient(sx,sy,cx,cy);bg.addColorStop(0,'rgba(255,246,200,.5)');bg.addColorStop(1,'rgba(255,244,190,.2)');
 x.fillStyle=bg;x.beginPath();x.moveTo(sx-10,sy);x.lineTo(sx+10,sy);x.lineTo(cx+68,cy+6);x.lineTo(cx-68,cy+6);x.closePath();x.fill();
 x.save();x.translate(cx,cy);x.scale(1,.8);
 const og=x.createRadialGradient(0,0,40,0,0,120);og.addColorStop(0,'rgba(255,244,190,.2)');og.addColorStop(1,'rgba(255,244,190,0)');x.fillStyle=og;x.beginPath();x.arc(0,0,120,0,7);x.fill();
 const dg=x.createRadialGradient(0,0,4,0,0,76);dg.addColorStop(0,'rgba(255,253,230,.97)');dg.addColorStop(.72,'rgba(255,246,196,.86)');dg.addColorStop(.93,'rgba(255,238,170,.45)');dg.addColorStop(1,'rgba(255,236,160,0)');
 x.fillStyle=dg;x.beginPath();x.arc(0,0,76,0,7);x.fill();x.restore();
 x.fillStyle='#07080d';x.save();x.translate(cx,cy+2);sigBat(x,62);x.restore();
 x.fillStyle='#06080e';x.fillRect(sx-16,sy-2,32,8);x.fillRect(sx-9,sy+6,18,114);
 x.fillStyle='#fff7cf';x.beginPath();x.ellipse(sx,sy,13,4,0,0,7);x.fill();
 const lg=x.createRadialGradient(sx,sy,0,sx,sy,34);lg.addColorStop(0,'rgba(255,245,190,.7)');lg.addColorStop(1,'rgba(255,245,190,0)');x.fillStyle=lg;x.fillRect(sx-34,sy-34,68,68)});
const VGS=mkLayer(100,150,x=>{const gr=x.createRadialGradient(50,75,42,50,75,117);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.6)');x.fillStyle=gr;x.fillRect(0,0,100,150)});
function archP(x,cx,y){x.beginPath();x.moveTo(cx-5,y+16);x.lineTo(cx-5,y+5);x.quadraticCurveTo(cx-5,y,cx,y-4);x.quadraticCurveTo(cx+5,y,cx+5,y+5);x.lineTo(cx+5,y+16);x.closePath()}
function mkWin(lit){return mkLayer(26,32,x=>{archP(x,13,8);
 if(lit){x.shadowColor='rgba(255,170,60,.7)';x.shadowBlur=9;const wg=x.createLinearGradient(0,4,0,24);wg.addColorStop(0,'#ffe3a0');wg.addColorStop(1,'#d98a2c');x.fillStyle=wg}else x.fillStyle='#0a0d16';
 x.fill();x.shadowBlur=0;x.strokeStyle=lit?'#2a2118':'rgba(0,0,0,.6)';x.lineWidth=1;x.beginPath();x.moveTo(13,5);x.lineTo(13,24);x.moveTo(8,15);x.lineTo(18,15);x.stroke();
 archP(x,13,8);x.strokeStyle='rgba(120,135,180,.55)';x.lineWidth=1.3;x.stroke()})}
const WINL=mkWin(true),WIND=mkWin(false);
function capDraw(x,upper){
 const cg=x.createLinearGradient(0,0,0,18);cg.addColorStop(0,'#3d4766');cg.addColorStop(1,'#171c2c');x.fillStyle=cg;x.fillRect(0,0,64,18);
 x.fillStyle='rgba(185,200,240,.45)';x.fillRect(0,0,64,1.5);x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,16,64,2);
 x.fillStyle='#0d101a';const yy=upper?11:3;for(let dx=3;dx<59;dx+=7)x.fillRect(dx,yy,4,4);
 x.fillStyle='rgba(0,0,0,.35)';x.fillRect(0,0,2,18);x.fillRect(62,0,2,18)}
const CAPU=mkLayer(64,18,x=>capDraw(x,true)),CAPL=mkLayer(64,18,x=>capDraw(x,false));
const SHAFT=mkLayer(54,H,x=>{
 x.fillStyle='#10141f';x.fillRect(4,0,46,H);x.save();x.beginPath();x.rect(4,0,46,H);x.clip();
 for(let ro=0;ro<Math.ceil(H/16);ro++)for(let c=-1;c<3;c++){const bx=4+c*23+(ro%2?11.5:0),by=ro*16;
  x.fillStyle='hsl(222,22%,'+(14+Math.random()*8)+'%)';x.fillRect(bx+.6,by+.6,21.8,14.8);
  x.fillStyle='rgba(150,170,220,.10)';x.fillRect(bx+.6,by+.6,21.8,1);x.fillStyle='rgba(0,0,0,.25)';x.fillRect(bx+.6,by+14.4,21.8,1)}
 for(let k=0;k<300;k++){x.fillStyle='rgba(0,0,0,'+Math.random()*.25+')';x.fillRect(4+Math.random()*46,Math.random()*H,1,1)}
 const sh=x.createLinearGradient(4,0,50,0);sh.addColorStop(0,'rgba(0,0,0,.55)');sh.addColorStop(.3,'rgba(0,0,0,0)');sh.addColorStop(.8,'rgba(0,0,0,.05)');sh.addColorStop(1,'rgba(0,0,0,.5)');x.fillStyle=sh;x.fillRect(4,0,46,H);
 x.fillStyle='rgba(0,0,0,.2)';x.fillRect(13,0,2,H);x.fillRect(36,0,2,H);x.fillStyle='rgba(150,170,220,.3)';x.fillRect(48,0,1.5,H);x.restore()});
const FW=800,FOG=(()=>{const c=document.createElement('canvas');c.width=FW;c.height=160;const x=c.getContext('2d');
 for(let i=0;i<46;i++){const bx=Math.random()*FW,by=60+Math.random()*90,r=40+Math.random()*70;
  [-FW,0,FW].forEach(d=>{const gr=x.createRadialGradient(bx+d,by,0,bx+d,by,r);gr.addColorStop(0,'rgba(150,165,185,.09)');gr.addColorStop(1,'rgba(150,165,185,0)');x.fillStyle=gr;x.fillRect(bx+d-r,by-r,r*2,r*2)})}
 return c})();
const HZ=g.createLinearGradient(0,H-330,0,H);HZ.addColorStop(0,'rgba(30,40,70,0)');HZ.addColorStop(1,'rgba(30,40,70,.4)');
const FG=g.createLinearGradient(0,H-110,0,H);FG.addColorStop(0,'rgba(70,85,110,0)');FG.addColorStop(1,'rgba(70,85,110,.3)');
const ST=g.createLinearGradient(0,H-26,0,H);ST.addColorStop(0,'#0d1019');ST.addColorStop(1,'#04050a');

// ---------- game logic ----------
function reset(){grapples=1;combo=0;perf=0;inv=0;grap=null;punchT=0;punchCd=0;kos=0;foes=[];pops=[];orbs=[];shots=[];heli=null;gust=null;shield=false;slowT=0;pat='rand';pstep=0;boss=null;bossOn=false;bossN=0;nextBoss=50;pipeN=0;GAP=BASE_GAP;SPEED=BASE_SPEED;msg=0;bat={x:100,y:Math.round(H*.45),v:0,r:0,lift:0,wing:0};pipes=[];score=0;t=0;for(let i=0;i<3;i++)addPipe(W+120+i*240)}
function mkFoe(x){const brute=score>=25&&Math.random()<.35;
 return{x,by:110+Math.random()*(H-300),y:300,hp:brute?2:1,brute,r:brute?19:14,ph:Math.random()*6,vx:0,vy:0,dead:false,hit:0,spin:0}}
function ko(f){f.dead=true;f.vx=4+Math.random()*2;f.vy=-7;kos++;shake=8;pops.push({x:f.x,y:f.y-20,t:55,txt:'KO!'})}
function punch(){if(state!=='play'||punchCd>0)return;punchT=12;punchCd=24;foes.forEach(f=>f.hitThis=false);if(boss)boss.hitThis=false}
function nextTop(){const lo=90,hi=H-GAP-140,rg=hi-lo;
 if(pipeN>=6&&pipeN%6===0){pat=['rand','zig','stair','tunnel'][Math.floor(Math.random()*4)];pstep=0}
 pstep++;let v;
 if(pat==='zig')v=lo+rg*(pstep%2?.15:.85);
 else if(pat==='stair'){const k=pstep%8,m=k<4?k:7-k;v=lo+rg*(.1+m*.26)}
 else if(pat==='tunnel')v=pstep===1?lo+rg*(.2+Math.random()*.6):lastTop+(Math.random()-.5)*20;
 else v=lo+Math.random()*rg;
 return lastTop=Math.max(lo,Math.min(hi,v))}
function addPipe(x){const top=nextTop();pipeN++;
 if(pipeN>4&&Math.random()<.2)orbs.push({x:x+Math.round((54+Math.max(185,245-score*1.6))/2),y:100+Math.random()*(H-300),type:['shield','slow','grap'][Math.floor(Math.random()*3)]});
 pipes.push({x,top,base:top,amp:score<6?0:Math.min(10+(score-6)*2.5,46),ph:Math.random()*6.28,gap:GAP,passed:false});
 if(score>=15&&pipeN>1&&Math.random()<.55)foes.push(mkFoe(x+Math.round((54+Math.max(185,245-score*1.6))/2)))}
function mkBolt(){let x=60+Math.random()*280,y=0;boltPts=[[x,y]];while(y<300){x+=(Math.random()-.5)*40;y+=18+Math.random()*26;boltPts.push([x,y])}}
function grapple(){if(state!=='play'||grap||grapples<1)return;
 if(!pipes.find(p=>p.x+54>bat.x-6))return;grapples--;grap={t:0,dur:46}}
function flap(){
 if(state==='ready'){state='play'}
 if(state==='play'){if(!grap){bat.v=Math.min(bat.v,0)*.3+JUMP*.62;bat.lift=1;bat.wing=1}}
 else if(state==='dead'&&t>35){state='ready';reset()}
}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}if(e.code==='KeyG')grapple();if(e.code==='KeyF'||e.code==='KeyX')punch()});
cv.addEventListener('pointerdown',e=>{e.preventDefault();const b=cv.getBoundingClientRect(),x=(e.clientX-b.left)/b.width*W,y=(e.clientY-b.top)/b.height*H;
 if(state==='play'&&y>H-92&&y<H-30){if(x<125){punch();return}if(x>W-125){grapple();return}}
 flap()});
function die(){if(state!=='play')return;if(shield){shield=false;inv=70;bat.v=-4.5;bat.lift=0;shake=10;pops.push({x:bat.x,y:bat.y-30,t:50,txt:'SHIELD!'});return}state='dead';bat.lift=0;t=0;shake=14;flash=1;if(score>best){best=score;try{localStorage.setItem('gg_best',best)}catch(e){}}}
function update(){
 t++;bat.wing=Math.max(0,bat.wing-.05);
 if(state==='ready'){bat.y=Math.round(H*.45)+Math.sin(t/12)*8;bat.r=0}
 if(state==='dead'||(state==='play'&&!grap)){bat.v=Math.min(bat.v+GRAV-(bat.lift>.03?.5*bat.lift:0)+(gust&&!grap?gust.dir*.07:0),MAXFALL);if(bat.v>0)bat.v*=.994;bat.lift*=.72;bat.y+=bat.v;bat.r+=(Math.max(-.4,Math.min(.9,bat.v/7))-bat.r)*.14}
 if(state==='play'){
  const sp=(grap?SPEED*2.8:SPEED)*(slowT>0?.72:1);if(slowT>0)slowT--;if(gust&&--gust.t<=0)gust=null;
  if(grap){grap.t++;bat.v=0;bat.r=0;const tg=pipes.find(p=>p.x+54>bat.x-6);if(tg)bat.y+=(tg.top+tg.gap/2-bat.y)*.14;if(grap.t>=grap.dur){grap=null;bat.v=-2;inv=40}}

// ---------- main loop: fixed 60Hz logic, adaptive resolution ----------
reset();
let last=0,acc=0,ft=16.7,fc=0;
function loop(now){
 const dt=Math.min(100,now-(last||now));last=now;acc+=dt;ft=ft*.95+dt*.05;
 let n=0;while(acc>=16.667&&n<3){update();acc-=16.667;n++}if(n===3)acc=0;
 draw();if(fc%30===0)fit();
 if(++fc>120){fc=0;if(ft>24&&DPR>1){DPR=Math.max(1,DPR-.5);setRes()}}
 requestAnimationFrame(loop)
}
requestAnimationFrame(loop);
